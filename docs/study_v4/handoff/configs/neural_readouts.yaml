  optional_allocation_required_for_C_G_M_execution: false
  primary_target: correctness of already sealed native selected answer
  primary_node: FINAL_HANDOFF_REPORT
  shadow_forecast_generated_fields_as_G_inputs: false
  outer_folds: 5
  inner_folds: 5
  evaluation: 'primary: 5-outer/5-inner grouped CV on development only, final selection/refit on full allowed development,
