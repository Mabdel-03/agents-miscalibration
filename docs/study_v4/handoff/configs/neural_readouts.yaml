  bootstrap:
    replicates: 20000
    unit: source cluster within superdomain
    primary: paired confirmation-loss bootstrap conditional on development-frozen predictors
    refit_primary_predictors: false
    preserve: complete source-item four-policy/feature-variant vector
    optional_pooled_OOF_learning_procedure: separately preregistered secondary only; full nested-pipeline bootstrap
