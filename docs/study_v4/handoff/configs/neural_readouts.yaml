  - log note length
  - visible-answer log likelihood
  - declared confidence
  - 8 visible-answer embedding PCs
  nuisance_controls:
  - intercept
  - domain
  fit: PCA of private valid-invalid contrasts after nuisance projection
  min_retained_aggregate_decoder_contrast: 0.8
  must_beat_same_rank_random: true
  rank1_collinearity: include semantic control eligibility, no forced orthogonalization
  selection_order:
  - screen 200 dev items
  - complete primary pilot on same 100 items for <=3 site/rank pairs and 3 doses
  - apply Section 9 eligibility/scenario planning gate
  - select smallest eligible rank within one SE then shallower block and qualifying dose
  dose_objective: lower 90% source-item bound on DIRECT unit-use gain; smaller dose within one SE
  development_harm_limits:
    correctness_loss: 0.02
    invalid_increase: 0.01
    peer_use_loss: 0.05
  donor: Q_U Q_U^T (h[PRIVATE,RESP_VALID]-h[PRIVATE,RESP_INVALID])
  donor_is_privileged_not_operational: true
  slot_matched_same_nominal_g_both_interfaces: true
  donor_prefills_on_all_edit_items: required even outside N_response; no extra generated response required
  transform: norm(h)*(h+v)/norm(h+v), v=0 exact no-op
  actual_displacements_logged_by_interface: true
  answer_gradient: future teacher-forced escaped visible answer after unchanged prefill and frozen native-final
    prefix; first <=64 tokens; no earlier input loss
  answer_prefix: '{"approach":"","evidence":[],"alternatives_considered":[],"failure_checks":[],"final_answer":"'
  control_max_abs_cosine: 0.9
  ineligible_controls: no-op plus denominator; compare matched BASE/U_PLUS/control eligible frame
  random:
    rng: PCG64DXSM
    seed_namespace: UNIT_RANDOM
    max_redraws: 32
    minimum_projected_norm: 1.0e-12
  primary_cells:
  - cell_id: U_PLUS_DIRECT
    interface: DIRECT
    vector: +alpha*g
    anchor: FINAL_STATE_PREFILL
  - cell_id: U_PLUS_PRIVATE
    interface: PRIVATE
    vector: +alpha*g
    anchor: FINAL_STATE_PREFILL
  - cell_id: U_MINUS_PRIVATE
    interface: PRIVATE
    vector: -alpha*g
    anchor: FINAL_STATE_PREFILL
  - cell_id: SEMANTIC_DIRECT
    interface: DIRECT
    vector: norm-matched preselected semantic-unit vector
    anchor: FINAL_STATE_PREFILL
    eligibility: valid audited semantic foil, finite nonzero vector, abs cosine(g,control)<=0.90
  - cell_id: ANSWER_DIRECT
    interface: DIRECT
    vector: norm-matched future visible-answer emission gradient
    anchor: FINAL_STATE_PREFILL
    eligibility: supported frozen output transition, finite nonzero gradient, abs cosine(g,control)<=0.90
  - cell_id: POSITION_DIRECT
    interface: DIRECT
    vector: +alpha*g
    anchor: TASK_ONLY_PREFILL
  - cell_id: RANDOM_DIRECT
    interface: DIRECT
    vector: norm-matched random orthogonal to unit/nuisance spans
    anchor: FINAL_STATE_PREFILL
    eligibility: valid target/donor and successful random construction
