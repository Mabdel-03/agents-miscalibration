  - CHILD_CONTRACT
  - TEAM_SELECTED
  - TEAM_AFTER_EXTRA
  forecast_fields:
  - q_personal
  - q_child_contract
  - q_team_now
  - q_recover
  - q_preserve
  shadow_forecast:
    panel: geometry/calibration panel
    one_per_selected_observer_checkpoint: true
    role_checkpoint_grid:
    - role: COMMON_REPORT_READER
      checkpoint: FINAL_HANDOFF_REPORT
      policies:
      - IND_VOTE
      - DEC
      - CEN_FLAT
      - CEN_RLM_D2_L5
      membership_N: 5
      budget: B4
      per_item_requests: 4
    selection: all four frozen primary policy reports; no hindsight-selected native final-call activation
    temperature: 0
    tools_enabled: false
    final_output_cap: 256
    native_reasoning_mode_and_cost_resolved: null
    feedback_to_generators_or_selectors: false
    secondary_role_checkpoint_grid: []
    primary_request_count: 4*N_CG (1200 default)
    exact_primary_requests_per_item: 4
    cost_scope: additional research work after native B4; not a free deployed B4 feature
  information_sets:
  - SELF_ONLY
  - PEER_EXPOSED
  - HUB_STATE
  - RLM_CONTEXT
  joint_category_order:
  - '00'
  - '01'
  - '10'
  - '11'
  joint_probabilities:
  - (1-q_team_now)*(1-q_recover)
  - (1-q_team_now)*q_recover
  - q_team_now*(1-q_preserve)
  - q_team_now*q_preserve
  invalid_forecast: development-fitted scope-specific marginal prior plus missingness flag
  inapplicable_null: not a failed forecast or zero probability
  binary_Brier: (q-y)^2
  multiclass_Brier: sum_c((p_c-indicator(y=c))^2)
  score_log_clip_epsilon: 1.0e-06
  weights: Section 9 source-item/domain weights, not recursive call/member frequency
  inflation: same-target increase in E[q-y] plus worse proper loss/registered calibration contrast, not higher q
    alone
  exact_primary_C_contrast: source-item mean Brier(development-calibrated selected PERSONAL_FINAL confidence) -
    Brier(development-calibrated explicit TEAM_SELECTED forecast), equally averaged across four fixed flagship N5
    B4 policy reports; positive one-sided, Section 9
  extra_budget_labels: actual saved-state continuation or valid causal replay; unrelated B4 episode is not a B2
    state continuation
  recalibration:
    both_predictors_same_development_only_procedure: true
    common_model: intercept + clipped probability logit + missingness flag
    architecture_conditioned_model: common model + architecture intercepts
    architecture_fit_min_successes_each: 10
    architecture_fit_min_failures_each: 10
    primary_rule: architecture-conditioned when every architecture meets minimum, otherwise common
    raw_scores_reported_also: true
    claims: forecast quality; calibration-specific claim additionally needs reliability/bias diagnostics
