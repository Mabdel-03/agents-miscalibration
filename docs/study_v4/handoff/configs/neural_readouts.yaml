geometry:
  primary_question: held-out functional prediction beyond matched observable/full-text baselines
  raw_metrics:
  - residual norm
  - pairwise distance
  normalized_metrics:
  - mean pairwise cosine distance
  - covariance eigenvalues
  - participation ratio
  - entropy effective rank
  participation_ratio: (sum(lambda))^2/sum(lambda^2)
  effective_rank: exp(-sum(p*log(p))), p=lambda/sum(lambda)
  rank_ceiling: min(d_eff,s-1)
  N1_dimension: undefined, not zero diversity evidence
  default_diagnostic_PCA_dimension: 64
  inferential_spectrum_sampling: same s without replacement per registered comparison, role rule, checkpoint and
    dimension; s is minimum count guaranteed by contract
  dimension_test_min_s: 3
  matched_subsamples_per_episode: 100
  subsamples_increase_N: false
  full_N_spectra: descriptive
  posttreatment_length_coverage_regressions: predictive/explanatory only, not adjusted causal effects
  functional_outcomes:
  - scoped full-answer agreement
  - frozen public-check signatures
  - preselected annotated unit coverage/use
  - oracle availability
  - sealed selected utility
  - blinded-selector leave-one-artifact-out sensitivity
  child_local_answers_treated_as_full_answer_disagreement: false
dependence:
  panel: system_repeat
  condition_on_source_item: true
  primary_descriptive_estimator: within-item episode sample covariance of matched full-answer member outcomes, then
    fixed item/pair weighted average
  zero_variance_correlation: undefined with flag
  pooled_across_task_covariance_reported_separately: true
  mixed_effects_sensitivity: item difficulty and item-episode effects; latent logistic ICC not Pearson correlation
  adaptive_children: align declared stable contract/role or use local-contract/common-consumer outcomes; never incidental
    call index
  team_success_from_independent_child_probability_product: false
calibration:
  scopes:
