neural_edits:
  interfaces:
  - DIRECT
  - PRIVATE
  panel: N_edit
  children_per_cell: 4
  development_items: 200
  causal_pilot_items: 100
  causal_pilot_balanced_domains: true
  subspace_ranks:
  - 1
  - 4
  - 16
  doses:
  - 0.25
  - 0.5
  - 1.0
  max_shortlisted_sites_ranks: 3
  nuisance_features:
