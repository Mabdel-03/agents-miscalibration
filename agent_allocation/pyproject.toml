[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-allocation"
version = "0.1.0"
description = "openrouter_agent_allocation_v1: budget-aware comparison of sampling, private revision, deep calls and communicating teams via OpenRouter"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "math-verify[antlr4_13_2]==0.9.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "jinja2==3.1.6",
]

[project.scripts]
allocation = "agent_allocation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_allocation"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
timeout = 300
timeout_method = "thread"
markers = [
    "live: requires the OpenRouter key and spends money; never run by default",
    "sandbox: requires bwrap/prlimit/libseccomp on this node",
    "needs_hf_cache: requires the pinned datasets in the shared offline HF cache",
    "slow: multi-minute cases (the dynorch 330 s / 660 s delayed-reply e2e); opt in with -m slow",
]
addopts = "-ra -m 'not live'"
