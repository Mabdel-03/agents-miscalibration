flagship: 32B          # amendment F1 (Qwen3.8-27B unsupported by vLLM 0.21.0)
judge_checkpoint: 32B  # amendment E1/J1: thinking off, temperature 0

# Engine facts entering engine_digest (identity.py) — informational copy for the freeze.
engine:
  vllm_version: "0.21.0"
  dtype: bf16
  reasoning_parser: qwen3
  max_model_len: 40960

# Decoding recipes (amendment F2).  types.py is the source of truth; the loader verifies
# these blocks agree with SOLVER_DECODING / JUDGE_DECODING / FORECAST_DECODING.
decoding:
  solver:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_tokens: 8192
    enable_thinking: true
    guided_json: false
  judge:
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_tokens: 1024
    enable_thinking: false
    guided_json: false
  forecast:
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    max_tokens: 256
    enable_thinking: false
    guided_json: false

# Frozen envelopes (spec §4.3, §6.4; amendment B2 / Table E; critic P1-1).
caps:
  task_tokens: 4096
  prompt_tokens: 32768
  solver_out: 8192
  selector_out: 1024
  forecast_out: 256
  own_candidate_tokens: 8192
  packet_tokens: 2048
  packet_final_tokens: 1024
  subtask_result_tokens: 4096
  hub_prior_plan_tokens: 8192
  forwarded_results_tokens: 8192
  hub_returned_results_tokens: 16384   # amendment B2b: hub returned-results block (review P0-A)
  hub_action_error_tokens: 512         # amendment B2b: rendered last_action_error allowance (A-6)
  solver_calls: 64
  selector_calls: 64
  dec_max_rounds: 8
  cen_max_cycles: 8

# Item counts (amendments N1, N1-SRS, N2, D1, E4b, M1b, AB1).  Panels are nested
# hash-prefix subsets of main; M is committed at 100 with 150 as a nested extension.
items:
  dev: {hle: 30, bcb: 30}
  main: {hle: 200, bcb: 200}
  panels:
    N: 100
    D: 100
    E: 30
    M: 100
    M_extension: 150
    B: 100

# §6.5 budget grid.  B0_flops stays null here; resources/profile.py computes it
# analytically (P1-1, amendment B1) and freeze() writes it into FROZEN.yaml.
budget:
  B0_flops: null
  budget_multipliers: [1, 2, 4, 8]
  primary: 4
