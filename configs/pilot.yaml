# Pilot sweep: validate the calibration/topology pipeline (3-axis, reasoning OFF).
# 2 Qwen3 sizes x {single_agent, decentralized} x {artifact_only, plus_cot} x {L1}
#   x truthfulqa, reasoning off. Single-agent collapses context-share -> ~6 cells.
# (For the reasoning axis specifically, use configs/pilot_reasoning.yaml.)
axes:
  model_size: ["1.7B", "8B"]
  topology: ["single_agent", "decentralized"]
  context_share_level: ["artifact_only", "plus_cot"]  # the two extremes of Axis 2
  prompt_complexity_level: [1]
  reasoning_level: ["off"]
  benchmark: ["truthfulqa"]   # MC1: exact option mass -> validates calibration path
  seed: [0]

fixed:
  n_agents: 3
  rounds: 2
  n_samples: 5
  temperature: 0.7
  n_questions: 100
