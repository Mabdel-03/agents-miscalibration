# End-to-end acceptance smoke for the selective TP=2 40K serving route and the
# finite-thinking protocol.  This is intentionally a separate immutable run: it is
# operational validation, not part of the 22,680-cell scientific design.
include_sas_baselines: false

axes:
  model_size: ["32B"]
  topology: ["decentralized"]
  n_agents: [3, 6, 7]
  context_share_level: ["plus_cot"]
  prompt_complexity_level: [3]
  reasoning_level: ["off", "b512", "b2048", "b8192", "unlimited"]
  benchmark: ["gpqa"]
  seed: [2]

fixed:
  rounds: 2
  n_samples: 1
  temperature: 0.7
  n_questions: 1
