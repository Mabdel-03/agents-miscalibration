# task_conditioned_dynamics_v1 — E0 legacy source registry (plan §2.6, D10; spec 7.1).
#
# Loaded by agents_scaling.nextdyn.e0.registry (WP7).  Every E0 read is a bounded named path
# from this file, never a directory walk; a missing path yields a BLOCKED_MISSING_SOURCE row.
# Paths are on the data filesystem (never the scratch FS; the compiler refuses scratch paths).
# `repo:` prefixes resolve against the repository root.

ard36:
  root: /orcd/data/tpoggio/001/mabdel03/agents_scaling_results/ard36
  tables: tables_v2                      # the repaired tables (v1 delta rows per claim)
  tables_v1: tables
  cells: cells
  items: data/public/items.parquet
  items_reserve: data/public/items_reserve.json
  items_summary: data/public/items_summary.json
  provenance: provenance
  stats: tables_v2/ard_stats.json
  calibration_panel: tables_v2/calibration_panel.parquet
  bank_summary: tables_v2/bank_summary.parquet

study_v4:
  root: /orcd/data/tpoggio/001/mabdel03/agents_scaling_results/study_v4
  tables: tables
  seals: seals
  tasks: data/public/tasks.jsonl        # WP7: the file lives under data/public/ (measured 2026-09-16)
  data_sha256: data/DATA_SHA256.json
  raw_bcb: data/raw/bigcodebench_v0.1.4.parquet
  eval_hle: eval/hle
  eval_bcb: eval/bcb
  geometry: neural/tables/geometry.parquet
  cells: cells

full_sweep_v1:
  root: /orcd/data/tpoggio/001/mabdel03/agents_scaling_results/full_sweep_v1
  cells: cells
  cells_json: cells.json
  contracts: benchmark_contracts.v1.json
  contracts_sha256: benchmark_contracts.v1.sha256
  cache:
    cells_dedup: repo:analysis/cache/cells_dedup_v1.parquet
    analysis_view: repo:analysis/cache/analysis_view_v1.parquet
    items: repo:analysis/cache/items_v1.parquet
    agents: repo:analysis/cache/agents_v1.parquet
    ingest_manifest: repo:analysis/cache/ingest_manifest_v1.json
  findings: repo:analysis/full_sweep_v1_findings.parquet

