  E2B_CONTROL_CORRECT: {packet_content: none, support: hidden, checker: false, draft_role: correct, phases: 2, templates: [receiver_plan, receiver_decision], display_label: E2B_CONTROL_CORRECT, legacy_alias: null, equivalent_to: null, enabled: true}
  E2B_CONTROL_WRONG:   {packet_content: none, support: hidden, checker: false, draft_role: wrong,   phases: 2, templates: [receiver_plan, receiver_decision], display_label: E2B_CONTROL_WRONG,   legacy_alias: null, equivalent_to: null, enabled: true}
